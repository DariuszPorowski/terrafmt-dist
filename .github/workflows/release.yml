---
name: Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 0"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Resolve latest upstream tag
        id: upstream
        run: |
          set -euo pipefail
          latest=$(gh release list --repo katbyte/terrafmt --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$latest" ]; then
            echo "No releases found in upstream repo." >&2
            exit 1
          fi
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check if tag already released
        id: check_tag
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}

      - name: Checkout release repo
        if: steps.check_tag.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout upstream source
        if: steps.check_tag.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: katbyte/terrafmt
          ref: ${{ steps.upstream.outputs.tag }}
          fetch-depth: 0
          path: terrafmt
          persist-credentials: false

      # - name: Patch upstream version constant
      #   if: steps.check_tag.outputs.exists != 'true'
      #   working-directory: terrafmt
      #   run: |
      #     set -euo pipefail
      #     version="${TAG#v}"
      #     sed -i "s/^const Version = \".*\"/const Version = \"${version}\"/" lib/version/version.go
      #   env:
      #     TAG: ${{ steps.upstream.outputs.tag }}

      - name: Setup Go
        if: steps.check_tag.outputs.exists != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Setup Syft
        if: steps.check_tag.outputs.exists != 'true'
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run GoReleaser
        if: steps.check_tag.outputs.exists != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --config "../.goreleaser.yml" --verbose
          workdir: terrafmt
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attest Archives
        if: steps.check_tag.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            terrafmt/dist/*.tar.gz
            terrafmt/dist/*.zip
